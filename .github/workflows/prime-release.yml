name: prime-release

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prime-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: bun install

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="$(bun -e '
            try {
              const r = await fetch("https://registry.npmjs.org/opencode-ai/latest", { headers: { accept: "application/json" } })
              if (!r.ok) throw new Error("npm " + r.status)
              const d = await r.json()
              console.log(d.version)
            } catch {
              const p = await Bun.file("packages/opencode/package.json").json()
              console.log(p.version)
            }
          ')"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            ESCAPED="$(printf '%s' "$BASE" | sed 's/\./\\./g')"
            LAST="$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' \
              | grep -E "^v${ESCAPED}\.P\.[0-9]+$" \
              | sed "s/^v${ESCAPED}\.P\.//" | sort -n | tail -n 1 || true)"
            NEXT="$(( ${LAST:-0} + 1 ))"
            echo "version=${BASE}.P.${NEXT}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${BASE}.P-dev.$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build OpenCode-Prime CLI
        run: ./script/build.ts --bin-name opencode-prime --targets linux-x64,linux-arm64,darwin-arm64,darwin-x64,win32-x64,win32-arm64 --skip-embed-web-ui
        working-directory: packages/opencode
        env:
          OPENCODE_CHANNEL: ${{ (github.ref_name == 'main' && 'latest') || 'dev' }}
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}

      - name: Package archives
        run: |
          set -euo pipefail
          cd packages/opencode/dist
          for dir in opencode-prime-*; do
            [ -d "$dir" ] || continue
            if [[ "$dir" == *linux* ]]; then
              tar -czf "$dir.tar.gz" -C "$dir/bin" .
            else
              ( cd "$dir/bin" && zip -qr "../../$dir.zip" . )
            fi
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            gh release create "v${{ steps.version.outputs.version }}" \
              --target "${{ github.sha }}" \
              --title "OpenCode-Prime v${{ steps.version.outputs.version }}" \
              --generate-notes \
              --repo "${{ github.repository }}"
          else
            gh release create "v${{ steps.version.outputs.version }}" \
              --target "${{ github.sha }}" \
              --title "OpenCode-Prime v${{ steps.version.outputs.version }}" \
              --prerelease \
              --generate-notes \
              --repo "${{ github.repository }}"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ steps.version.outputs.version }}" \
            packages/opencode/dist/opencode-prime-*.tar.gz \
            packages/opencode/dist/opencode-prime-*.zip \
            --clobber \
            --repo "${{ github.repository }}"

      - name: Prune old dev prereleases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,prerelease \
            --jq '.[] | select(.prerelease == true) | .tagName' \
            | tail -n +6 \
            | while read -r tag; do
                gh release delete "$tag" --yes --cleanup-tag --repo "${{ github.repository }}" || true
              done
