name: prime-release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prime-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: bun install

      - name: Compute version
        id: version
        run: echo "version=0.0.0-dev-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build OpenCode-Prime CLI
        run: ./script/build.ts --bin-name opencode-prime --targets linux-x64,darwin-arm64,darwin-x64,win32-x64 --skip-embed-web-ui
        working-directory: packages/opencode
        env:
          OPENCODE_CHANNEL: dev
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}

      - name: Package archives
        run: |
          set -euo pipefail
          cd packages/opencode/dist
          for dir in opencode-prime-*; do
            [ -d "$dir" ] || continue
            if [[ "$dir" == *linux* ]]; then
              tar -czf "$dir.tar.gz" -C "$dir/bin" .
            else
              ( cd "$dir/bin" && zip -qr "../../$dir.zip" . )
            fi
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "OpenCode-Prime v${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ steps.version.outputs.version }}" \
            packages/opencode/dist/opencode-prime-*.tar.gz \
            packages/opencode/dist/opencode-prime-*.zip \
            --clobber \
            --repo "${{ github.repository }}"

      - name: Prune old dev releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 20 \
            | awk '{print $1}' | tail -n +6 \
            | while read -r tag; do
                gh release delete "$tag" --yes --repo "${{ github.repository }}" || true
              done
