name: prime-release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prime-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: bun install

      - name: Build OpenCode-Prime CLI
        run: ./script/build.ts --bin-name opencode-prime --targets linux-x64,darwin-arm64,darwin-x64,win32-x64 --skip-embed-web-ui
        working-directory: packages/opencode
        env:
          OPENCODE_CHANNEL: dev

      - name: Package archives
        run: |
          set -euo pipefail
          cd packages/opencode/dist
          for dir in opencode-prime-*; do
            [ -d "$dir" ] || continue
            if [[ "$dir" == *linux* ]]; then
              tar -czf "$dir.tar.gz" -C "$dir/bin" .
            else
              ( cd "$dir/bin" && zip -qr "../../$dir.zip" . )
            fi
          done

      - name: Create rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create prime-dev \
            --target "${{ github.sha }}" \
            --title "OpenCode-Prime (dev)" \
            --repo "${{ github.repository }}" \
            || true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload prime-dev \
            packages/opencode/dist/opencode-prime-*.tar.gz \
            packages/opencode/dist/opencode-prime-*.zip \
            --clobber \
            --repo "${{ github.repository }}"
